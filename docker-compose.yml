services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: arxiv-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1"
      interval: 10s
      retries: 10
      start_period: 20s

  pipeline:
    build: .
    container_name: arxiv-pipeline
    env_file: .env
    environment:
      SQL_HOST: sqlserver
      SQL_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./sample:/app/sample:ro
      - ivy-cache:/root/.ivy2.5.2
    depends_on:
      sqlserver:
        condition: service_healthy
    profiles: ["pipeline"]

  api:
    build: .
    container_name: arxiv-api
    env_file: .env
    environment:
      SQL_HOST: sqlserver
      SQL_PASSWORD: ${SQL_PASSWORD}
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

volumes:
  mssql-data:
  ivy-cache:
